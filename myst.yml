version: 1
project:
  title: Advanced Analytics and Algorithmic Trading
  authors:
    - name: Javier Sabio González
  github: https://xaviweise.github.io/aaat/
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/aaat.pdf
  toc:
    - file: welcome.md
    - title: Introduction
      children:
        - file: markdown/releases.md
        - file: markdown/dedication.md
        - file: markdown/preface.md
        - file: markdown/symbollist.md
    - title: Financial Markets Fundamentals
      children:
        - file: markdown/intro_financial_markets.md
        - file: markdown/intro_financial_instruments.md
        - file: markdown/market_microstructure.md
        - file: markdown/algorithmic_trading.md
    - title: Financial Modelling Fundamentals
      children:
        - file: markdown/intro_bayesian.md
        - file: markdown/intro_causal.md
        - file: markdown/stochastic_calculus.md
        - file: markdown/stochastic_optimal_control.md
        - file: markdown/data_driven_methods.md
        - file: markdown/generative_ai.md
    - title: Execution Algorithms
      children:
        - file: markdown/execution_fundamentals.md
        - file: markdown/lob_models.md
        - file: markdown/optimal_execution.md
        - file: markdown/execution_tactics.md
    - title: Market Making Algorithms
      children:
        - file: markdown/market_making_fundamentals.md
        - file: markdown/fair_price_estimation.md
        - file: markdown/liquidity_modelling.md
        - file: markdown/rfq_models.md
        - file: markdown/optimal_market_making.md
        - file: markdown/optimal_hedging.md
    - title: Investment Algorithms
      children:
        - file: markdown/quant_investment_fundamentals.md
        - file: markdown/mean_reversion_strategies.md
        - file: markdown/optimal_investment_theory.md
    - title: Glossary and References
      children:
        - file: markdown/glossary.md
        - file: markdown/references.md
    - title: Notebooks
      children:
        - file: notebooks/stochastic_calculus.ipynb
        - file: notebooks/bayesian_theory.ipynb
        - file: notebooks/market_microstructure.ipynb
        - file: notebooks/lob_models.ipynb
        - file: notebooks/execution_algorithms.ipynb
        - file: notebooks/fair_price_estimation.ipynb
        - file: notebooks/liquidity_modelling.ipynb
        - file: notebooks/rfq_models.ipynb
        - file: notebooks/market_making.ipynb
        - file: notebooks/generative_ai.ipynb
        - file: notebooks/quant_investment.ipynb
site:
  options:
    folders: true
    base_url: "/"
  template: book-theme
  actions:
    - title: Advanced Analytics and Algorithmic Trading
      url: https://www.datasciencealgotrading.com